name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=5s --health-retries=30
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/notification_center
      DB_NAME: ci_notification_center
      ASSET_BASE_URL: https://assets.example.com
      SITE_BASE_URL: https://www.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Fail fast: lint and build run before the database suite. Test setup sets STANDINS=true itself and creates
      # DB_NAME on the service container, exactly as locally.
      - run: npm test
  image:
    # "The image builds" is checked on every push; nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t notification-center:ci .
      - name: image refuses to start without configuration
        run: '! docker run --rm notification-center:ci'
