# ONE shared MySQL for every worktree; each worktree uses its own database (DB_NAME).
services:
  mysql:
    image: mysql:8
    container_name: notification-center-mysql
    command: ["--max-allowed-packet=64M"]
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 40
